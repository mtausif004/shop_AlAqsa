<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Al Aqsa Burmese Shop</title>
  <script>
    // GitHub Pages has no server-side rewrite rules. Preserve the requested
    // path and send it to the app shell; index.html restores the URL.
    (function () {
      var l = window.location;
      var path = l.pathname;
      var query = l.search ? l.search.slice(1) : '';
      var payload = 'p=' + encodeURIComponent(path.replace(/^\//, ''));
      if (query) payload += '&q=' + encodeURIComponent(query);
      l.replace(l.origin + '/?'+ payload + l.hash);
    })();
  </script>
</head>
<body>
  <p>পেজ লোড হচ্ছে...</p>
</body>
</html>
