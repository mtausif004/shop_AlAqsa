<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting - Al Aqsa Burmese Shop</title>
    <script type="text/javascript">
      // GitHub Pages SPA deep link redirection handler
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>পুনরায় লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
  </body>
</html>
